[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-agent-engine"
version = "0.1.0"
description = "Evidence-first coordinated YouTube channel workflow"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
youtube-competitor-analysis = "youtube_agent.competitor_cli:main"
youtube-competitor-fetch = "youtube_agent.competitor_fetch:main"
youtube-workflow-plan = "youtube_agent.workflow_cli:main"
